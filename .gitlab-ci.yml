# .gitlab-ci.yml

image: node:18

stages:
  - deploy

pages:
  stage: deploy
  
  script:
    # Export your actual environment variables
    - export BREVO_API_KEY=$BREVO_API_KEY
    - export BREVO_LIST_ID=$BREVO_LIST_ID
    - export YOUTUBE_API_KEY=$YOUTUBE_API_KEY
    - export YOUTUBE_CHANNEL_ID=$YOUTUBE_CHANNEL_ID
    
    # Install and build
    - npm ci
    - npm run build
    
    # Copy to public folder for GitLab Pages
    - cp -r dist public
  
  artifacts:
    paths:
      - public
  
  only:
    - main
